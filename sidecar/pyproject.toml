[project]
name = "savepoint-sidecar"
version = "0.1.0"
description = "Python sidecar for Savepoint AI — Ollama chat, embeddings, RAG over sqlite-vec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
savepoint-sidecar = "app.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
